# helparr beside an existing *arr stack (FR8, REQ-DEPLOY-008/009, AC11).
#
# Copy this next to the compose file that already runs Sonarr, Radarr and
# Prowlarr, fill in the two secrets, and `docker compose up -d`. Nothing else
# needs editing — which is the point: an example that requires five unexplained
# edits before it starts is a worked example of nothing.
#
# There are no literal secrets in this file and there never may be. A compose
# file gets committed, pasted into forum posts and read by `docker inspect`;
# the placeholders below are deliberately non-functional so that starting
# helparr without replacing them fails at startup with a message naming the
# variable, rather than silently coming up with a guessable key.

services:
  helparr:
    # Published multi-arch: the same tag resolves to amd64 on an Intel NAS and
    # to arm64 on Apple silicon, so this line is identical on both. The package
    # is private during internal testing — `docker login ghcr.io` with a token
    # carrying `read:packages` before the first pull, or this fails as
    # `denied`. See the README's Docker section.
    #
    # Images are built from `v*` git tags only, so `:latest` is the newest
    # release and there is nothing floating on the default branch to point at.
    # Pin `:<version>` here once you have a deployment worth reproducing.
    image: ghcr.io/feliperuzg/helparr:latest
    # Or build it here instead of pulling. This is not just an offline escape
    # hatch: the published image is the empty-base-path build, and basePath is
    # compiled in, so serving helparr under a subpath REQUIRES building your
    # own. Startup refuses a mismatch rather than serving an app whose assets
    # all 404.
    #   build:
    #     context: .
    #     args:
    #       HELPARR_BASE_PATH: /helparr
    container_name: helparr
    restart: unless-stopped

    ports:
      # Publish on the LAN, or drop this and put helparr on the same network as
      # your reverse proxy. helparr terminates no TLS itself.
      - "3000:3000"

    environment:
      # ---- Required ------------------------------------------------------
      # Encrypts instance credentials at rest. Generate one, keep it, and back
      # it up: it is not recoverable, and without it the database cannot be
      # read. `openssl rand -base64 32`
      #
      # CHANGE-ME is not a key. helparr will refuse to start until it is
      # replaced — the variable is read from the shell or a .env file beside
      # this compose file, never written here.
      HELPARR_ENCRYPTION_KEY: ${HELPARR_ENCRYPTION_KEY:?set HELPARR_ENCRYPTION_KEY in a .env file beside this compose file}

      # ---- First run only ------------------------------------------------
      # The SETUP password: how you get in the first time, not where the
      # password lives. helparr hashes it on first start and the variable is
      # inert afterwards, so leaving it here cannot silently reset a password
      # you later changed under Settings. Minimum 8 characters.
      #
      # Change it in the UI (Settings -> Operator password) as soon as you are
      # in. helparr shows a banner until you do: a password in a file is
      # readable by anything that can read the file.
      HELPARR_INITIAL_PASSWORD: ${HELPARR_INITIAL_PASSWORD:?set HELPARR_INITIAL_PASSWORD in a .env file beside this compose file}

      # ---- Forgot the password? -------------------------------------------
      # Uncomment, restart once, sign in with HELPARR_INITIAL_PASSWORD above,
      # change the password under Settings, then COMMENT THIS BACK OUT and
      # restart again.
      #
      # It fires at most once per time you set it, so a line left uncommented
      # cannot undo your next password change on some later restart — but it
      # also will not work a second time until you remove it and set it again.
      # helparr warns on every start while it is still here.
      # HELPARR_PASSWORD_RESET: "1"

      # ---- Optional ------------------------------------------------------
      # debug | info | warn | error. Credentials are redacted at every level.
      HELPARR_LOG_LEVEL: info
      # How often the queue screen re-reads your instances. Minimum 5.
      HELPARR_QUEUE_REFRESH_SECONDS: "30"

    volumes:
      # The database and its -wal/-shm sidecars must share one mount, so the
      # directory is mounted rather than the .db file. Mounting the file alone
      # is the classic way to corrupt a WAL database on restart.
      - helparr-data:/data

    # Reaches the unauthenticated liveness route, which reports only that the
    # process is up and the database opens. A Sonarr outage does not make
    # helparr unhealthy — the route has no opinion about your instances.
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # Add helparr to whatever network your *arr containers already share, and
    # then use their service names as base URLs in Settings — e.g.
    # http://sonarr:8989. If they are on the host network instead, use the
    # host's LAN address; helparr does not care which, it just needs to reach
    # them.
    networks:
      - arr

volumes:
  helparr-data:

networks:
  arr:
    # Already defined by your *arr stack — point this at it instead of letting
    # compose create a second, isolated one.
    external: true
    name: arr

# ---------------------------------------------------------------------------
# Variant: the key from a file instead of the environment (Docker secrets)
#
# HELPARR_ENCRYPTION_KEY_FILE is an indirection to the same key, not a second
# key. Set exactly one of the two — helparr refuses both at once rather than
# picking a winner, because a silent winner between two secrets is how you
# encrypt against a key you did not think you were using.
#
#   services:
#     helparr:
#       environment:
#         HELPARR_ENCRYPTION_KEY_FILE: /run/secrets/helparr_encryption_key
#         # and no HELPARR_ENCRYPTION_KEY at all
#       secrets:
#         - helparr_encryption_key
#
#   secrets:
#     helparr_encryption_key:
#       file: ./secrets/helparr_encryption_key   # not committed; chmod 600
#
# A trailing newline in the file is expected and stripped — `printf '%s' ...`
# and `openssl rand -base64 32 > file` both work.
