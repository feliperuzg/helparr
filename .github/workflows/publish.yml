# Publishes the helparr container image to GHCR, for linux/amd64 and
# linux/arm64, from one tag.
#
# Shape: ci → two native builds → merge. Each architecture is built on a
# runner of that architecture and pushed *by digest* (no tag); the merge job
# assembles one image index over both digests and applies the tags. The
# alternative — one runner declaring both platforms — emulates one of them
# under QEMU, and this Dockerfile compiles better-sqlite3-multiple-ciphers from
# source and runs `next build`, which is the worst possible workload to emulate.
#
# Nothing is published by pushing code. A tag is the only trigger, and the tag
# only builds once the whole of ci.yml is green — `workflow_call` plus `needs:`,
# so the dependency is an actual edge in the graph rather than two workflows
# racing. Publishing a broken image is cheap to do and expensive to undo: the
# digest is already in the registry and somebody may already have pulled it.
#
# `ubuntu-24.04-arm` is a standard, included-minutes runner in private
# repositories as of 2026-01-29. Guidance older than that says arm64 needs a
# paid larger runner here; it no longer does. Private-repo arm runners get
# 2 vCPU against a public repo's 4, so the arm64 leg is the slow one.
#
# This workflow does not set the package's visibility, and deliberately so:
# GHCR defaults to private on first publish, and flipping a package public is a
# one-way door that no CI run should be able to walk through by itself.

name: publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# The only permissions the publish path needs. No repository secret is added
# for this workflow: GITHUB_TOKEN with packages:write both authenticates the
# push and is what links the package to this repository (ADR-8). Note there is
# no `packages: delete` permission in this model, which is why no retention
# policy ships here.
permissions:
  contents: read
  packages: write

# A tag run is never cancelled: a cancelled release build is a release that
# silently did not happen. Only a manual dispatch, which can be re-triggered at
# will, is superseded by a newer one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # GHCR requires a lowercase path. `feliperuzg/helparr` already is, and
  # deriving it means a fork pushes to its own namespace rather than this one.
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # The whole suite, not a subset: typecheck, lint, units, and the browser lane
  # that drives a real standalone server. This used to be an inline job running
  # the fast lanes only, on the argument that nobody had measured what the
  # heavy ones cost in CI. That argument buys a few minutes per release and
  # pays for them with the one failure mode worth avoiding here — a published
  # tag whose app does not start.
  #
  # `permissions` is narrowed for the call: ci.yml needs nothing but the
  # checkout, and a reusable workflow inherits the caller's token otherwise.
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: build ${{ matrix.platform }}
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      # Independent legs: one architecture failing must not hide or cancel the
      # other's result, so a failure is attributable to an architecture (AC12).
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Used to name this leg's digest artifact. "linux/amd64" → "linux-amd64":
      # artifact names cannot contain a slash, and v4+ artifacts must be unique
      # across parallel jobs.
      - name: Derive platform slug
        run: echo "PLATFORM_SLUG=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Labels only in this job — the tags are applied once, by the merge job,
      # to the index rather than to either child manifest.
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      # No QEMU setup step: this runner's architecture IS matrix.platform, so
      # `npm ci` and `next build` run natively and the native modules they
      # produce match the glibc and architecture that will run them — the
      # invariant the Dockerfile's header states (REQ-DEPLOY-017).
      #
      # HELPARR_BASE_PATH is left at its default empty value. It is compiled
      # into the server, the client bundles and every asset URL, so one
      # published image is one base path; serving helparr under a subpath still
      # requires a local build, and startup refuses a mismatch rather than
      # serving an app whose every stylesheet 404s (REQ-DEPLOY-007/019).
      #
      # push-by-digest: this leg pushes a manifest with no tag attached.
      # provenance/sbom off: buildx's default attestations appear in GHCR's UI
      # as a third `unknown/unknown` architecture and have been reported to
      # stop GHCR reading the image's labels — including the source label this
      # image carries specifically so the package links to its repo (ADR-5).
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          sbom: false

      # The digest is the only thing the merge job needs from this leg. It
      # travels as an empty file named after the digest, because a matrix job
      # cannot contribute to a shared output.
      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ env.PLATFORM_SLUG }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge manifest
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags are derived from the ref, never hand-written (REQ-DEPLOY-019):
      #   tag v1.2.3        → `1.2.3`, `1.2`, `latest`, and `sha-<short>`
      #   manual dispatch   → `main` and `sha-<short>`
      # The branch and sha rules are kept for the dispatch path only: pushing
      # to main no longer triggers this workflow, so `:main` is now something
      # that exists on purpose or not at all. `latest` is restricted to version
      # tags — floating it on main would mean a bare
      # `docker pull ghcr.io/feliperuzg/helparr` silently picks up unreleased
      # work (ADR-9).
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto

      # One index over the per-platform digests the build jobs pushed. The
      # children stay untagged by design — which is exactly why the usual
      # "prune untagged versions" cleanup recipe would break this tag.
      - name: Create and push the manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          # SC2046 is the mechanism here, not a bug: both substitutions expand
          # to several arguments (one -t per tag, one ref per digest file).
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY_IMAGE}@sha256:%s " *)

      # Prints the published index's platform list into the run log, so "the
      # tag serves both architectures" is a checked fact rather than a
      # remembered one (AC2).
      - name: Inspect the published image
        run: docker buildx imagetools inspect "${REGISTRY_IMAGE}:${{ steps.meta.outputs.version }}"
